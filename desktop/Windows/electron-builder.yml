appId: com.omi.computer-windows
productName: Omi
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
# Runtime resources the MAIN process reads from disk must be real files (not in
# asar). extraResources copies them to process.resourcesPath; resources.ts reads
# them from there. (Renderer assets are bundled into out/ by Vite separately.)
extraResources:
  - from: resources/ocr-worker.ps1
    to: ocr-worker.ps1
  - from: resources/tray_icon.png
    to: tray_icon.png
asarUnpack:
  - "**/*.node"
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Omi
portable:
  artifactName: Omi-${version}-portable.exe
protocols:
  - name: Omi Computer
    schemes: [omi-computer]
publish:
  - provider: github
    owner: ZachL111
    repo: omi
electronDownload:
  cache: .electron-cache
npmRebuild: true
